services:
  db:
    image: postgres:16
    container_name: adatheque-db
    environment:
      POSTGRES_USER: adatheque
      POSTGRES_PASSWORD: adatheque
      POSTGRES_DB: adatheque_db
    ports:
      - "5451:5432"
    volumes:
      - adatheque-data:/var/lib/postgresql/data

volumes:
  adatheque-data:
